# Publie Les Enchaînés (statique) sur GitHub Pages à chaque push sur master.
name: Pages
on:
  push:
    branches: [master]
    paths: ['enchaines/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Tests de la simulation
        run: |
          node enchaines/test_sim.js
          node enchaines/test_level.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: enchaines
      - id: deployment
        uses: actions/deploy-pages@v4
